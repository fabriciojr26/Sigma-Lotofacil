name: Loto Facil Lab — testes isolados
on:
  push:
    branches:
      - research/lotofacil-lab-v01-20261019
    paths:
      - 'lab/**'
      - '.github/workflows/lab-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar invariantes e gerador sem deploy
        run: python -m unittest discover -s lab -p 'test_*.py' -v
      - name: Comparar carteira diversificada com random K=20 no IID
        run: python lab/lotofacil_v01.py simulate --n 5000 --seed 20261019 --out out/mc

      - name: Estudo multi-seed K=20 (sem deploy)
        run: python lab/benchmark_k20.py 6000 12
