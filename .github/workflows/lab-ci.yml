name: Loto Facil Lab — testes isolados
on:
  push:
    branches:
      - research/lotofacil-lab-v01-20261019
    paths:
      - 'lab/**'
      - '.github/workflows/lab-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar invariantes e gerador sem deploy
        run: python -m unittest discover -s lab -p 'test_*.py' -v
      - name: Comparar carteira diversificada com random K=20 no IID
        run: python lab/lotofacil_v01.py simulate --n 5000 --seed 20261019 --out out/mc

      - name: Estudo multi-seed K=20 (sem deploy)
        run: python lab/benchmark_k20.py 6000 12

      - name: Construir 20 bilhetes com prova matematica de cobertura 13+
        run: python lab/cobertura_otima13.py --seed 20261019 --out out/otimo13
      - name: Exportar 20 jogos e certificado (sem deploy)
        uses: actions/upload-artifact@v4
        with:
          name: LotoFacil-20-jogos-otimos-13plus-demo
          path: out/otimo13/
          retention-days: 30

      - name: Empacotar fonte do plugin privado
        run: |
          mkdir -p out/plugin
          cd lotofacil-plugin
          zip -qr ../out/plugin/loto-facil-lab-0.1.0.zip plugin.json .codex-plugin skills
          cd ..
          unzip -l out/plugin/loto-facil-lab-0.1.0.zip
      - name: Disponibilizar pacote do plugin
        uses: actions/upload-artifact@v4
        with:
          name: LotoFacil-plugin-fonte-v0-1
          path: out/plugin/loto-facil-lab-0.1.0.zip
          retention-days: 30
